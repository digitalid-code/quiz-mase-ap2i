<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Sécurité – AP2I – EPI : choix, port et entretien</title>
<style>
  :root {
    --navy:    #1B3A6B;
    --orange:  #E8521A;
    --light:   #F4F6F9;
    --white:   #FFFFFF;
    --text:    #1C2B42;
    --muted:   #607090;
    --success: #1E7E34;
    --danger:  #B91C1C;
    --warn:    #D97706;
    --mid:     #D0D9E8;
    --shadow:  0 4px 16px rgba(27,58,107,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Calibri, Arial, sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }

  .header {
    background: var(--navy); padding: 18px 32px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-shield { font-size: 28px; }
  .header-title { color: white; font-size: 18px; font-weight: 700; }
  .header-sub { color: #A8BEDD; font-size: 12px; margin-top: 2px; }

  .main { max-width: 800px; margin: 0 auto; padding: 32px 16px 64px; }

  .participant-card {
    background: white; border-radius: 12px;
    padding: 32px; box-shadow: var(--shadow);
    border-top: 4px solid var(--orange);
  }
  .participant-card h2 { color: var(--navy); font-size: 20px; margin-bottom: 8px; }
  .participant-card p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .form-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 200px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--mid);
    border-radius: 8px; font-size: 14px; color: var(--text);
    background: var(--light); transition: border 0.2s;
  }
  .form-group input:focus { outline: none; border-color: var(--navy); background: white; }

  .topic-banner {
    background: var(--navy); color: white;
    border-radius: 10px; padding: 16px 20px;
    margin-bottom: 24px; display: flex; gap: 14px; align-items: flex-start;
  }
  .topic-banner .topic-icon { font-size: 28px; flex-shrink: 0; }
  .topic-banner h3 { font-size: 16px; margin-bottom: 4px; }
  .topic-banner p { font-size: 12px; color: #A8BEDD; }

  .btn-start {
    width: 100%; padding: 14px; background: var(--navy);
    color: white; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  .btn-start:hover { background: #142D55; }

  .progress-wrap { margin-bottom: 28px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--navy); }
  .progress-count { font-size: 13px; color: var(--muted); }
  .progress-bar { height: 8px; background: var(--mid); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--navy); border-radius: 4px; transition: width 0.4s ease; }

  .question-card {
    background: white; border-radius: 12px;
    padding: 28px 32px; box-shadow: var(--shadow);
    border-top: 4px solid var(--navy);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .question-meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .question-text { font-size: 17px; font-weight: 700; color: var(--navy); line-height: 1.5; margin-bottom: 24px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 13px 18px; border: 2px solid var(--mid);
    border-radius: 10px; cursor: pointer; display: flex; gap: 12px;
    align-items: flex-start; background: var(--light); transition: all 0.18s;
    font-size: 14px; color: var(--text); line-height: 1.4;
  }
  .option:hover:not(.disabled) { border-color: var(--navy); background: #EDF2FA; }
  .option .opt-letter {
    font-size: 12px; font-weight: 700; color: var(--navy);
    background: var(--mid); border-radius: 50%;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .option.correct  { border-color: var(--success); background: #EBF8F0; }
  .option.wrong    { border-color: var(--danger);  background: #FDECEA; }
  .option.correct .opt-letter { background: var(--success); color: white; }
  .option.wrong .opt-letter   { background: var(--danger);  color: white; }
  .option.disabled { cursor: default; }

  .feedback {
    margin-top: 20px; padding: 14px 18px; border-radius: 10px;
    font-size: 13.5px; line-height: 1.55; animation: fadeIn 0.3s ease;
  }
  .feedback.correct-fb { background: #EBF8F0; border-left: 4px solid var(--success); color: #154A22; }
  .feedback.wrong-fb   { background: #FDECEA; border-left: 4px solid var(--danger);  color: #7B1C1C; }
  .feedback .fb-title  { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .feedback .fb-ref    { font-size: 11.5px; color: var(--muted); margin-top: 6px; font-style: italic; }

  .btn-next {
    margin-top: 20px; padding: 11px 28px; background: var(--navy);
    color: white; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s;
  }
  .btn-next:hover { background: #142D55; }

  .results-card {
    background: white; border-radius: 12px;
    padding: 36px 32px; box-shadow: var(--shadow);
    border-top: 4px solid var(--orange); animation: fadeIn 0.3s ease;
  }
  .results-card h2 { color: var(--navy); font-size: 22px; margin-bottom: 8px; }

  .score-ring-wrap { display: flex; flex-direction: column; align-items: center; margin: 24px 0; }
  .score-circle {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 12px; font-weight: 700;
  }
  .score-circle .sc-pct { font-size: 36px; color: white; }
  .score-circle .sc-raw { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 2px; }
  .score-success { background: var(--success); }
  .score-partial { background: var(--warn); }
  .score-fail    { background: var(--danger); }
  .score-message { font-size: 15px; font-weight: 700; color: var(--navy); text-align: center; }
  .score-sub     { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }

  .stats-row { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 100px; background: var(--light); border-radius: 8px; padding: 14px; text-align: center; }
  .stat-box .sb-val { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-box .sb-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .review-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .review-item { border-radius: 8px; overflow: hidden; border: 1.5px solid var(--mid); }
  .review-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; cursor: pointer; background: var(--light);
  }
  .review-icon { font-size: 16px; flex-shrink: 0; }
  .review-q { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
  .review-chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  .review-item.open .review-chevron { transform: rotate(90deg); }
  .review-body { display: none; padding: 12px 14px; font-size: 13px; background: white; border-top: 1px solid var(--mid); }
  .review-item.open .review-body { display: block; }
  .review-body .rv-your    { color: var(--danger); margin-bottom: 4px; }
  .review-body .rv-correct { color: var(--success); margin-bottom: 4px; }
  .review-body .rv-expl    { color: var(--muted); font-style: italic; font-size: 12px; }

  .tracking-box {
    margin-top: 20px; padding: 12px 16px; border-radius: 8px;
    font-size: 13px; display: flex; align-items: center; gap: 10px;
  }
  .tracking-box.sent    { background: #EBF8F0; color: var(--success); }
  .tracking-box.pending { background: #FFF7ED; color: var(--warn); }
  .tracking-box.error   { background: #FDECEA; color: var(--danger); }

  .footer {
    background: var(--navy); color: #A8BEDD;
    text-align: center; padding: 14px 16px; font-size: 11px; margin-top: 40px;
  }
</style>
</head>
<body>

<div class="header">
  <span class="header-shield">🧤</span>
  <div>
    <div class="header-title">Quiz Sécurité – AP2I</div>
    <div class="header-sub">EPI : choix, port obligatoire et entretien · Septembre 2026</div>
  </div>
</div>

<div class="main" id="app"></div>

<div class="footer">
  AP2I – Filiale TREMA Multitechnique · Reims · Formation Sécurité · Septembre 2026
</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxAcSxX0gp_OMD_DreugvJLvO2QYkqCpv_lmLUP4Bzww9fbfFkPaquzq0_zzQ1kurzANg/exec'; 

// ═══════════════════════════════════════════════════════════════════════════
// QUESTIONS
// ═══════════════════════════════════════════════════════════════════════════
const QUESTIONS = [
  {
    q: "Où se situe l'équipement de protection individuelle dans l'ordre des principes généraux de prévention ?",
    choices: [
      "En premier : c'est la mesure la plus efficace contre le risque électrique",
      "En dernier : il couvre le risque résiduel, une fois la protection collective mise en place",
      "Au même niveau que la protection collective, au choix de l'intervenant",
      "Il ne fait pas partie des principes généraux de prévention"
    ],
    answer: 1,
    expl: "Les principes généraux de prévention s'appliquent dans un ordre : éviter le risque, le combattre à la source, puis donner la priorité aux mesures de protection collective sur les mesures de protection individuelle. L'EPI ne supprime jamais le risque, il en limite les conséquences — il ne dispense donc ni de la consignation ni du balisage.",
    ref: "Ancré MASE v2024 (principes généraux de prévention)"
  },
  {
    q: "À quelle catégorie appartiennent les gants isolants et les harnais antichute au sens du règlement européen sur les EPI ?",
    choices: [
      "Catégorie I, car ils sont d'usage quotidien",
      "Ils ne relèvent d'aucune catégorie, étant réservés aux professionnels habilités",
      "Catégorie II, comme la majorité des EPI de chantier",
      "Catégorie III, réservée aux risques pouvant avoir des conséquences très graves et irréversibles"
    ],
    answer: 3,
    expl: "La catégorie III couvre les risques de conséquences très graves et irréversibles, dont le risque électrique et les chutes de hauteur. Elle impose un contrôle supplémentaire de la production et rend la formation à l'utilisation obligatoire.",
    ref: "Source externe : règlement (UE) 2016/425, annexe I"
  },
  {
    q: "Qui supporte le coût des EPI nécessaires à votre poste ?",
    choices: [
      "L'employeur : les EPI sont fournis gratuitement, et il en assure l'entretien et le remplacement",
      "Le salarié, qui se fait ensuite rembourser sur note de frais",
      "Le client sur le site duquel l'intervention est réalisée",
      "L'employeur pour la première dotation seulement, le salarié pour les renouvellements"
    ],
    answer: 0,
    expl: "Les EPI sont fournis gratuitement par l'employeur, qui assure leur bon fonctionnement et leur maintien en état hygiénique par les entretiens, réparations et remplacements nécessaires. Aucune dépense liée à la sécurité n'est à la charge du salarié, y compris pour les renouvellements.",
    ref: "Source externe : Code du travail, art. R4323-95"
  },
  {
    q: "Votre collègue a oublié ses gants isolants. Vous avez les vôtres dans votre véhicule. Que faut-il faire ?",
    choices: [
      "Les lui prêter : deux personnes peuvent utiliser la même paire dans la journée",
      "Les lui prêter uniquement si vous avez la même taille de main",
      "Ne pas les prêter : les EPI sont attribués nominativement et réservés à un usage personnel",
      "Les lui prêter après les avoir simplement essuyés"
    ],
    answer: 2,
    expl: "Les EPI sont réservés à un usage personnel dans le cadre des activités de leur attributaire. Le prêt informel fait perdre la traçabilité des contrôles et pose des problèmes d'hygiène et d'ajustement. La bonne réaction est de signaler le manque à l'encadrement avant l'intervention, pas de dépanner sur le chantier.",
    ref: "Source externe : Code du travail, art. R4323-96"
  },
  {
    q: "Pourquoi les gants isolants en latex se portent-ils avec des surgants en cuir ?",
    choices: [
      "Pour améliorer le confort thermique en hiver",
      "Parce que les gants isolants n'offrent pas de résistance mécanique : sans surgant, une coupure ou une perforation compromet l'isolation",
      "Pour augmenter la classe de tension des gants isolants",
      "Ce n'est qu'une recommandation esthétique liée à la tenue de travail"
    ],
    answer: 1,
    expl: "Le gant isolant assure la fonction diélectrique, pas la protection mécanique. Le surgant cuir le protège des coupures, perforations et arêtes vives. Une association d'EPI doit rester efficace simultanément : en cas de doute, la notice du fabricant tranche.",
    ref: "Source externe : NF EN 60903 et notices fabricants"
  },
  {
    q: "À quelle fréquence devez-vous examiner vos gants isolants avant de les utiliser ?",
    choices: [
      "Une fois par semaine, en début de semaine",
      "Une fois par mois, lors de la réunion sécurité",
      "Uniquement lors de la vérification périodique réalisée par un organisme",
      "Avant chaque utilisation, sans exception"
    ],
    answer: 3,
    expl: "L'examen avant utilisation est systématique : lecture du marquage, examen de la surface à la recherche de coupures ou craquelures, gonflage à l'air pour détecter les fuites, contrôle de l'intérieur. C'est l'obligation la plus fréquente et la plus souvent négligée. Au moindre doute, le gant n'est pas utilisé.",
    ref: "Source externe : NF EN 60903, annexe E (examen avant utilisation)"
  },
  {
    q: "Une paire de gants isolants de classe 2 dort dans un placard depuis huit mois, encore dans son emballage et jamais utilisée. Peut-on l'employer ?",
    choices: [
      "Non : aucun gant de classe 1 à 4, même stocké, ne peut être utilisé sans essai diélectrique datant de moins de six mois",
      "Oui, puisqu'elle n'a jamais servi et que l'emballage est intact",
      "Oui, à condition de faire un simple contrôle visuel avant de la porter",
      "Oui, le délai ne court qu'à partir de la première utilisation"
    ],
    answer: 0,
    expl: "Le délai court indépendamment de l'usage : le stockage n'exempte pas de l'essai. Pour les classes 1 à 4, l'inspection périodique comprend un essai de gonflage, un contrôle visuel et un essai diélectrique individuel. Pour les classes 00 et 0, le gonflage et l'examen visuel sont considérés adéquats.",
    ref: "Source externe : NF EN 60903, annexe E (inspection périodique et nouveaux essais électriques)"
  },
  {
    q: "Comment vos gants isolants doivent-ils être rangés entre deux interventions ?",
    choices: [
      "Roulés en boule dans la poche de la veste de travail, pour les avoir sous la main",
      "Au fond de la caisse à outils, avec le reste du petit matériel",
      "Dans leur étui d'origine, à plat, au sec et à l'écart des outils et des sources de chaleur",
      "Sur le tableau de bord du véhicule, pour qu'ils sèchent au soleil"
    ],
    answer: 2,
    expl: "Les gants isolants se conservent dans leur boîte ou sachet de protection, sans contact avec des objets tranchants ou pointus, et à distance de toute source de chaleur. Un rangement en vrac, plié, humide ou exposé aux hydrocarbures dégrade l'isolation sans que cela se voie forcément.",
    ref: "Source externe : NF EN 60903 (conditions de conservation) et notices fabricants"
  },
  {
    q: "Parmi ces EPI utilisés chez AP2I, lequel relève d'une vérification générale périodique annuelle obligatoire prévue par la réglementation ?",
    choices: [
      "Les lunettes de protection",
      "Le système de protection individuelle contre les chutes de hauteur (harnais, longe)",
      "Le casque de chantier",
      "Les chaussures de sécurité"
    ],
    answer: 1,
    expl: "L'arrêté du 19 mars 1993 fixe une liste limitative d'EPI soumis à vérification générale périodique annuelle, qui comprend les systèmes de protection individuelle contre les chutes de hauteur. Les casques, lunettes et chaussures n'y figurent pas : pour eux, c'est la notice du fabricant qui fixe la conduite à tenir.",
    ref: "Source externe : Code du travail art. R4323-99 et arrêté du 19 mars 1993"
  },
  {
    q: "En ouvrant votre étui avant une intervention, vous constatez une fine craquelure sur un gant isolant. Le chantier est urgent. Que faites-vous ?",
    choices: [
      "Vous l'utilisez pour cette intervention et le signalez à votre retour",
      "Vous le réparez avec du ruban adhésif isolant le temps de l'intervention",
      "Vous le remettez dans le stock commun pour qu'un collègue en juge l'état",
      "Vous ne l'utilisez pas, vous le retirez du service et vous signalez immédiatement pour obtenir un équipement conforme"
    ],
    answer: 3,
    expl: "Une craquelure disqualifie le gant : il sort définitivement du service, ne se répare pas et ne retourne pas dans le stock commun où un autre intervenant pourrait le reprendre. L'urgence du chantier ne crée pas d'exception — l'intervention ne reprend qu'avec un équipement conforme.",
    ref: "Cas terrain AP2I – mise au rebut et signalement (NF EN 60903, art. R4323-95 du Code du travail)"
  }
];

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const state = {
  screen: 'participant',
  participant: { prenom: '', nom: '', poste: '' },
  current: 0,
  answers: [],
  startTime: null,
  trackingStatus: 'pending',
};

const app = document.getElementById('app');

function render() {
  if (state.screen === 'participant') renderParticipant();
  else if (state.screen === 'quiz')   renderQuiz();
  else                                renderResults();
}

// ── PARTICIPANT ───────────────────────────────────────────────────────────
function renderParticipant() {
  app.innerHTML = `
    <div class="participant-card">
      <h2>Vos informations</h2>
      <p>Renseignez vos coordonnées avant de commencer. Vos résultats seront transmis automatiquement.</p>

      <div class="topic-banner">
        <span class="topic-icon">🧤</span>
        <div>
          <h3>Formation : EPI — choix, port obligatoire et entretien</h3>
          <p>10 questions · Hiérarchie de prévention · Choix et catégories · Obligations de port · Entretien et vérifications</p>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input type="text" id="prenom" placeholder="Votre prénom" value="${state.participant.prenom}">
        </div>
        <div class="form-group">
          <label for="nom">Nom *</label>
          <input type="text" id="nom" placeholder="Votre nom" value="${state.participant.nom}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="poste">Poste / Fonction</label>
          <input type="text" id="poste" placeholder="Ex : Électricien industriel, Automaticien…" value="${state.participant.poste !== '-' ? state.participant.poste : ''}">
        </div>
      </div>
      <button class="btn-start" onclick="startQuiz()">Commencer le quiz →</button>
    </div>
  `;
}

function startQuiz() {
  const p = document.getElementById('prenom').value.trim();
  const n = document.getElementById('nom').value.trim();
  const po = document.getElementById('poste').value.trim();
  if (!p || !n) { alert('Veuillez renseigner votre prénom et votre nom.'); return; }
  state.participant = { prenom: p, nom: n, poste: po || '-' };
  state.current = 0; state.answers = [];
  state.startTime = Date.now(); state.screen = 'quiz';
  render();
}

// ── QUIZ ──────────────────────────────────────────────────────────────────
function renderQuiz() {
  const idx = state.current;
  const total = QUESTIONS.length;
  const q = QUESTIONS[idx];
  const answered = state.answers[idx] !== undefined;
  const chosen = state.answers[idx];
  const pct = Math.round((idx / total) * 100);
  const letters = ['A', 'B', 'C', 'D'];

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-label">Question ${idx + 1} / ${total}</span>
        <span class="progress-count">${pct}% complété</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="question-card">
      <div class="question-meta">EPI : choix, port obligatoire et entretien</div>
      <div class="question-text">${q.q}</div>

      <div class="options" id="optList">
        ${q.choices.map((c, i) => {
          let cls = 'option';
          if (answered) {
            cls += ' disabled';
            if (i === q.answer)  cls += ' correct';
            else if (i === chosen && i !== q.answer) cls += ' wrong';
          }
          return `<div class="${cls}" onclick="selectAnswer(${i})">
            <span class="opt-letter">${letters[i]}</span>
            <span>${c}</span>
          </div>`;
        }).join('')}
      </div>

      ${answered ? `
        <div class="feedback ${chosen === q.answer ? 'correct-fb' : 'wrong-fb'}">
          <div class="fb-title">${chosen === q.answer ? '✅ Bonne réponse !' : '❌ Réponse incorrecte'}</div>
          ${q.expl}
          <div class="fb-ref">${q.ref}</div>
        </div>
        <button class="btn-next" onclick="nextQuestion()">
          ${idx + 1 < total ? 'Question suivante →' : 'Voir mes résultats →'}
        </button>
      ` : ''}
    </div>
  `;
}

function selectAnswer(i) {
  if (state.answers[state.current] !== undefined) return;
  state.answers[state.current] = i;
  render();
}

function nextQuestion() {
  if (state.current + 1 < QUESTIONS.length) {
    state.current++;
    render();
  } else {
    state.screen = 'results';
    sendToSheets();
    render();
  }
}

// ── RESULTS ───────────────────────────────────────────────────────────────
function renderResults() {
  const total = QUESTIONS.length;
  const score = state.answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const pct   = Math.round((score / total) * 100);
  const dur   = Math.round((Date.now() - state.startTime) / 60000);

  const ringCls = pct >= 70 ? 'score-success' : pct >= 50 ? 'score-partial' : 'score-fail';
  const msg = pct >= 70
    ? 'Formation validée – Bon travail !'
    : pct >= 50
    ? 'Des lacunes persistent – Revoir le support de formation'
    : 'Score insuffisant – Une révision complète est nécessaire';

  const reviewItems = QUESTIONS.map((q, i) => {
    const a = state.answers[i];
    const ok = a === q.answer;
    const letters = ['A', 'B', 'C', 'D'];
    return `
      <div class="review-item" id="rv${i}">
        <div class="review-header" onclick="toggleReview(${i})">
          <span class="review-icon">${ok ? '✅' : '❌'}</span>
          <span class="review-q">Q${i+1} – ${q.q.substring(0, 70)}…</span>
          <span class="review-chevron">▶</span>
        </div>
        <div class="review-body">
          ${!ok ? `<div class="rv-your">Votre réponse : ${letters[a]} – ${q.choices[a]}</div>` : ''}
          <div class="rv-correct">✔ Bonne réponse : ${letters[q.answer]} – ${q.choices[q.answer]}</div>
          <div class="rv-expl">${q.expl}</div>
          <div class="rv-expl" style="margin-top:4px;">${q.ref}</div>
        </div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="results-card">
      <h2>Résultats de ${state.participant.prenom} ${state.participant.nom}</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:4px;">
        Poste : ${state.participant.poste} &nbsp;·&nbsp; Durée : ${dur} min &nbsp;·&nbsp; Septembre 2026
      </p>

      <div class="score-ring-wrap">
        <div class="score-circle ${ringCls}">
          <span class="sc-pct">${pct}%</span>
          <span class="sc-raw">${score} / ${total}</span>
        </div>
        <div class="score-message">${msg}</div>
        <div class="score-sub">Seuil de validation : 70%</div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="sb-val" style="color:var(--success)">${score}</div>
          <div class="sb-lbl">Bonnes réponses</div>
        </div>
        <div class="stat-box">
          <div class="sb-val" style="color:var(--danger)">${total - score}</div>
          <div class="sb-lbl">Mauvaises réponses</div>
        </div>
        <div class="stat-box">
          <div class="sb-val">${dur}</div>
          <div class="sb-lbl">Minutes</div>
        </div>
      </div>

      <div class="tracking-box ${state.trackingStatus === 'sent' ? 'sent' : state.trackingStatus === 'error' ? 'error' : 'pending'}" id="trackBox">
        ${state.trackingStatus === 'sent'
          ? '✅ Résultats enregistrés dans Google Sheets'
          : state.trackingStatus === 'error'
          ? "⚠️ Erreur d'envoi – vérifiez la configuration dans le fichier HTML"
          : '⏳ Envoi en cours…'}
      </div>

      <h3 style="margin-top:24px;color:var(--navy);font-size:16px;">Revue question par question</h3>
      <div class="review-list">${reviewItems}</div>

      <button class="btn-next" style="margin-top:24px" onclick="location.reload()">Recommencer le quiz</button>
    </div>
  `;
}

function toggleReview(i) {
  const el = document.getElementById('rv' + i);
  el.classList.toggle('open');
  el.querySelector('.review-chevron').textContent = el.classList.contains('open') ? '▼' : '▶';
}

// ── TRACKING ──────────────────────────────────────────────────────────────
async function sendToSheets() {
  if (!SHEETS_URL) { state.trackingStatus = 'error'; return; }
  const now   = new Date();
  const total = QUESTIONS.length;
  const score = state.answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const dur   = Math.round((Date.now() - state.startTime) / 60000);
  const details = QUESTIONS.map((q, i) => `Q${i+1}:${state.answers[i] === q.answer ? 'OK' : 'KO'}`).join(' | ');

  const payload = {
    date:        now.toLocaleDateString('fr-FR'),
    heure:       now.toLocaleTimeString('fr-FR'),
    prenom:      state.participant.prenom,
    nom:         state.participant.nom,
    poste:       state.participant.poste || '-',
    score:       score,
    total:       total,
    pourcentage: Math.round((score / total) * 100) + '%',
    duree:       dur,
    details:     details,
    formation:   "Septembre 2026 – EPI : choix, port obligatoire et entretien"
  };

  try {
    await fetch(SHEETS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    state.trackingStatus = 'sent';
  } catch(err) {
    state.trackingStatus = 'error';
  }

  const tb = document.getElementById('trackBox');
  if (tb) {
    tb.className = 'tracking-box ' + (state.trackingStatus === 'sent' ? 'sent' : 'error');
    tb.textContent = state.trackingStatus === 'sent'
      ? '✅ Résultats enregistrés dans Google Sheets'
      : "⚠️ Erreur d'envoi – vérifiez la configuration dans le fichier HTML";
  }
}

render();
</script>
</body>
</html>
