<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Sécurité – AP2I – Accident, presqu'accident et droit d'alerte et de retrait</title>
<style>
  :root {
    --navy:    #1B3A6B;
    --orange:  #E8521A;
    --light:   #F4F6F9;
    --white:   #FFFFFF;
    --text:    #1C2B42;
    --muted:   #607090;
    --success: #1E7E34;
    --danger:  #B91C1C;
    --warn:    #D97706;
    --mid:     #D0D9E8;
    --shadow:  0 4px 16px rgba(27,58,107,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Calibri, Arial, sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }

  .header {
    background: var(--navy); padding: 18px 32px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-shield { font-size: 28px; }
  .header-title { color: white; font-size: 18px; font-weight: 700; }
  .header-sub { color: #A8BEDD; font-size: 12px; margin-top: 2px; }

  .main { max-width: 800px; margin: 0 auto; padding: 32px 16px 64px; }

  .participant-card {
    background: white; border-radius: 12px;
    padding: 32px; box-shadow: var(--shadow);
    border-top: 4px solid var(--orange);
  }
  .participant-card h2 { color: var(--navy); font-size: 20px; margin-bottom: 8px; }
  .participant-card p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .form-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 200px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--mid);
    border-radius: 8px; font-size: 14px; color: var(--text);
    background: var(--light); transition: border 0.2s;
  }
  .form-group input:focus { outline: none; border-color: var(--navy); background: white; }

  .topic-banner {
    background: var(--navy); color: white;
    border-radius: 10px; padding: 16px 20px;
    margin-bottom: 24px; display: flex; gap: 14px; align-items: flex-start;
  }
  .topic-banner .topic-icon { font-size: 28px; flex-shrink: 0; }
  .topic-banner h3 { font-size: 16px; margin-bottom: 4px; }
  .topic-banner p { font-size: 12px; color: #A8BEDD; }

  .btn-start {
    width: 100%; padding: 14px; background: var(--navy);
    color: white; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  .btn-start:hover { background: #142D55; }

  .progress-wrap { margin-bottom: 28px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--navy); }
  .progress-count { font-size: 13px; color: var(--muted); }
  .progress-bar { height: 8px; background: var(--mid); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--navy); border-radius: 4px; transition: width 0.4s ease; }

  .question-card {
    background: white; border-radius: 12px;
    padding: 28px 32px; box-shadow: var(--shadow);
    border-top: 4px solid var(--navy);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .question-meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .question-text { font-size: 17px; font-weight: 700; color: var(--navy); line-height: 1.5; margin-bottom: 24px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 13px 18px; border: 2px solid var(--mid);
    border-radius: 10px; cursor: pointer; display: flex; gap: 12px;
    align-items: flex-start; background: var(--light); transition: all 0.18s;
    font-size: 14px; color: var(--text); line-height: 1.4;
  }
  .option:hover:not(.disabled) { border-color: var(--navy); background: #EDF2FA; }
  .option .opt-letter {
    font-size: 12px; font-weight: 700; color: var(--navy);
    background: var(--mid); border-radius: 50%;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .option.correct  { border-color: var(--success); background: #EBF8F0; }
  .option.wrong    { border-color: var(--danger);  background: #FDECEA; }
  .option.correct .opt-letter { background: var(--success); color: white; }
  .option.wrong .opt-letter   { background: var(--danger);  color: white; }
  .option.disabled { cursor: default; }

  .feedback {
    margin-top: 20px; padding: 14px 18px; border-radius: 10px;
    font-size: 13.5px; line-height: 1.55; animation: fadeIn 0.3s ease;
  }
  .feedback.correct-fb { background: #EBF8F0; border-left: 4px solid var(--success); color: #154A22; }
  .feedback.wrong-fb   { background: #FDECEA; border-left: 4px solid var(--danger);  color: #7B1C1C; }
  .feedback .fb-title  { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .feedback .fb-ref    { font-size: 11.5px; color: var(--muted); margin-top: 6px; font-style: italic; }

  .btn-next {
    margin-top: 20px; padding: 11px 28px; background: var(--navy);
    color: white; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s;
  }
  .btn-next:hover { background: #142D55; }

  .results-card {
    background: white; border-radius: 12px;
    padding: 36px 32px; box-shadow: var(--shadow);
    border-top: 4px solid var(--orange); animation: fadeIn 0.3s ease;
  }
  .results-card h2 { color: var(--navy); font-size: 22px; margin-bottom: 8px; }

  .score-ring-wrap { display: flex; flex-direction: column; align-items: center; margin: 24px 0; }
  .score-circle {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 12px; font-weight: 700;
  }
  .score-circle .sc-pct { font-size: 36px; color: white; }
  .score-circle .sc-raw { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 2px; }
  .score-success { background: var(--success); }
  .score-partial { background: var(--warn); }
  .score-fail    { background: var(--danger); }
  .score-message { font-size: 15px; font-weight: 700; color: var(--navy); text-align: center; }
  .score-sub     { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }

  .stats-row { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 100px; background: var(--light); border-radius: 8px; padding: 14px; text-align: center; }
  .stat-box .sb-val { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-box .sb-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .review-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .review-item { border-radius: 8px; overflow: hidden; border: 1.5px solid var(--mid); }
  .review-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; cursor: pointer; background: var(--light);
  }
  .review-icon { font-size: 16px; flex-shrink: 0; }
  .review-q { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
  .review-chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  .review-item.open .review-chevron { transform: rotate(90deg); }
  .review-body { display: none; padding: 12px 14px; font-size: 13px; background: white; border-top: 1px solid var(--mid); }
  .review-item.open .review-body { display: block; }
  .review-body .rv-your    { color: var(--danger); margin-bottom: 4px; }
  .review-body .rv-correct { color: var(--success); margin-bottom: 4px; }
  .review-body .rv-expl    { color: var(--muted); font-style: italic; font-size: 12px; }

  .tracking-box {
    margin-top: 20px; padding: 12px 16px; border-radius: 8px;
    font-size: 13px; display: flex; align-items: center; gap: 10px;
  }
  .tracking-box.sent    { background: #EBF8F0; color: var(--success); }
  .tracking-box.pending { background: #FFF7ED; color: var(--warn); }
  .tracking-box.error   { background: #FDECEA; color: var(--danger); }

  .footer {
    background: var(--navy); color: #A8BEDD;
    text-align: center; padding: 14px 16px; font-size: 11px; margin-top: 40px;
  }
</style>
</head>
<body>

<div class="header">
  <span class="header-shield">🚨</span>
  <div>
    <div class="header-title">Quiz Sécurité – AP2I</div>
    <div class="header-sub">Accident, presqu'accident et droit d'alerte et de retrait · Août 2026</div>
  </div>
</div>

<div class="main" id="app"></div>

<div class="footer">
  AP2I – Filiale TREMA Multitechnique · Reims · Formation Sécurité · Août 2026
</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxAcSxX0gp_OMD_DreugvJLvO2QYkqCpv_lmLUP4Bzww9fbfFkPaquzq0_zzQ1kurzANg/exec'; 

// ═══════════════════════════════════════════════════════════════════════════
// QUESTIONS
// ═══════════════════════════════════════════════════════════════════════════
const QUESTIONS = [
  {
    q: "Qu'est-ce qui distingue un presqu'accident d'un accident ?",
    choices: [
      "Le presqu'accident ne concerne que le matériel, l'accident uniquement les personnes",
      "Le presqu'accident est un évènement survenu en dehors du lieu de travail",
      "Le presqu'accident aurait pu entraîner un dommage, l'accident en a effectivement entraîné un",
      "Le presqu'accident ne concerne que les intérimaires et les sous-traitants"
    ],
    answer: 2,
    expl: "Les deux définitions sont identiques à un mot près. L'accident est un évènement survenu sur le lieu de travail ou du fait du travail qui a entraîné un dommage ; le presqu'accident, un évènement qui aurait pu en entraîner un. Dans les deux cas, le dommage peut toucher les personnes, les biens ou l'environnement.",
    ref: "Ancré MASE v2024 (lexique : accident / presqu'accident)"
  },
  {
    q: "En arrivant sur un TGBT, vous constatez qu'un capot de protection a été déposé et laissé de côté par un intervenant précédent. Rien ne s'est produit. Comment qualifier cela ?",
    choices: [
      "Une situation dangereuse",
      "Un accident du travail sans arrêt",
      "Un presqu'accident",
      "Rien de particulier : sans évènement, il n'y a rien à signaler"
    ],
    answer: 0,
    expl: "Tant qu'aucun évènement ne s'est produit, il s'agit d'une situation dangereuse : une situation dans laquelle un dommage est possible en relation avec un ou plusieurs phénomènes dangereux. Elle se sécurise et se signale au même titre qu'un presqu'accident.",
    ref: "Ancré MASE v2024 (lexique : situation dangereuse)"
  },
  {
    q: "Vous vous coupez la main en fin de journée sur un chantier. Dans quel délai devez-vous informer votre employeur ?",
    choices: [
      "Dans les 8 jours suivant l'accident",
      "Uniquement s'il y a un arrêt de travail",
      "Dans les 48 heures",
      "Le jour même, et au plus tard dans les 24 heures"
    ],
    answer: 3,
    expl: "Le salarié victime informe son employeur le jour même, au plus tard dans les 24 heures suivant l'accident (sauf force majeure, impossibilité absolue ou motif légitime). L'employeur dispose ensuite de 48 heures, hors dimanches et jours fériés, pour déclarer l'accident à la CPAM. Un accident qui paraît bénin se déclare aussi.",
    ref: "Source externe : Code de la sécurité sociale (art. L441-1 et R441-2 pour le salarié ; art. L441-2 et R441-3 pour l'employeur)"
  },
  {
    q: "Pourquoi faut-il remonter un presqu'accident alors que personne n'a été blessé ?",
    choices: [
      "Pour identifier le responsable de l'évènement",
      "Parce que les causes sont les mêmes que celles d'un accident : les traiter maintenant évite un blessé plus tard",
      "Parce que c'est exigé uniquement sur les sites classés",
      "Uniquement lorsqu'il y a eu des dégâts matériels chiffrables"
    ],
    answer: 1,
    expl: "Un outil qui tombe blesse ou ne blesse personne selon qu'un collègue se trouve ou non dessous : les causes sont strictement les mêmes, seule l'issue diffère. L'analyse des situations dangereuses, des presqu'accidents et des accidents sert à évaluer l'efficacité du système de prévention et à alimenter le plan d'actions.",
    ref: "Ancré MASE v2024 (axe 4 : efficacité du système de management)"
  },
  {
    q: "Après un évènement, on vous demande de participer au recueil des faits. Que doit-il contenir ?",
    choices: [
      "Votre avis sur les responsabilités de chacun",
      "Uniquement la date de l'évènement et le nom de la victime",
      "Les circonstances exactes : qui, quoi, où, quand, comment, avec quoi",
      "Une proposition de sanction pour la personne concernée"
    ],
    answer: 2,
    expl: "Le recueil des faits détaille les circonstances exactes de l'évènement — qui, quoi, où, quand, comment, avec quoi — afin de contrôler l'efficacité des actions immédiates et de préparer, si le seuil est dépassé, une analyse approfondie des causes. Il décrit des faits, pas des responsabilités.",
    ref: "Ancré MASE v2024 (recueil des faits, axe 4)"
  },
  {
    q: "À quel moment le droit d'alerte doit-il être exercé ?",
    choices: [
      "Immédiatement, dès qu'il existe un motif raisonnable de penser qu'une situation présente un danger grave et imminent, ou en cas de défectuosité constatée d'un système de protection",
      "À la fin de l'intervention, dans le compte rendu de chantier",
      "Uniquement lors de la réunion sécurité mensuelle",
      "Seulement après avoir obtenu l'accord écrit du client"
    ],
    answer: 0,
    expl: "Le travailleur alerte immédiatement l'employeur de toute situation de travail dont il a un motif raisonnable de penser qu'elle présente un danger grave et imminent pour sa vie ou sa santé, ainsi que de toute défectuosité qu'il constate dans les systèmes de protection. L'alerte ne se reporte pas à plus tard.",
    ref: "Source externe : Code du travail, art. L4131-1"
  },
  {
    q: "Un salarié se retire d'une situation dont il avait un motif raisonnable de penser qu'elle présentait un danger grave et imminent. Quelle en est la conséquence sur sa rémunération et sa situation ?",
    choices: [
      "Une retenue de salaire proportionnelle au temps d'arrêt",
      "Un avertissement écrit s'il n'a pas prévenu le CSE au préalable",
      "La perte des heures correspondantes au titre de la modulation",
      "Aucune sanction ni retenue de salaire ne peut être prise à son encontre"
    ],
    answer: 3,
    expl: "Aucune sanction et aucune retenue de salaire ne peuvent être prises à l'encontre d'un travailleur, ou d'un groupe de travailleurs, qui se sont retirés d'une situation de travail dont ils avaient un motif raisonnable de penser qu'elle présentait un danger grave et imminent pour leur vie ou leur santé.",
    ref: "Source externe : Code du travail, art. L4131-3"
  },
  {
    q: "Quelle limite s'impose à l'exercice du droit de retrait ?",
    choices: [
      "Il ne peut être exercé qu'une seule fois par an et par salarié",
      "Il doit être exercé de telle manière qu'il ne crée pas pour autrui une nouvelle situation de danger grave et imminent",
      "Il ne s'applique ni aux salariés en CDD ni aux intérimaires",
      "Il n'est possible que si un représentant du personnel est présent sur le site"
    ],
    answer: 1,
    expl: "Se mettre en sécurité ne doit pas exposer les autres. Concrètement : on ne quitte pas une installation dans un état plus dangereux qu'on ne l'a trouvée. Consigner, baliser et prévenir font partie du retrait.",
    ref: "Source externe : Code du travail, art. L4132-1"
  },
  {
    q: "Vous arrivez pour intervenir sur une armoire chez un client. La consignation annoncée ne peut pas être vérifiée et plusieurs indices laissent penser que l'installation est encore alimentée. Quelle est la meilleure conduite à tenir ?",
    choices: [
      "Intervenir avec des gants isolants, cela suffit à couvrir le risque",
      "Attendre sur place sans rien dire que quelqu'un vienne confirmer la consignation",
      "Ne pas commencer, vous mettre en sécurité et alerter immédiatement votre encadrement et le client, puis ne reprendre qu'après levée du danger",
      "Commencer par les parties basses de l'armoire, moins exposées"
    ],
    answer: 2,
    expl: "Une consignation non vérifiable sur une installation potentiellement sous tension réunit les deux critères du danger grave et imminent. On n'engage pas la tâche, on se met en sécurité et on alerte sans délai. L'EPI ne compense pas l'absence de consignation, et attendre en silence ne fait pas cesser le danger pour les autres intervenants.",
    ref: "Cas terrain AP2I – application du droit d'alerte et de retrait (Code du travail, art. L4131-1)"
  },
  {
    q: "En fin de journée sur un site client, une clé vous échappe depuis une nacelle et tombe à un mètre d'un opérateur du client. Personne n'est touché. Que faites-vous ?",
    choices: [
      "Vous remontez l'évènement le jour même à votre encadrement et au client, en décrivant les faits",
      "Rien : sans blessé ni dégât matériel, il n'y a pas lieu de signaler",
      "Vous en parlez seulement si l'opérateur du client s'en plaint",
      "Vous attendez le bilan de fin de chantier pour l'évoquer"
    ],
    answer: 0,
    expl: "C'est un presqu'accident caractérisé : l'évènement aurait pu entraîner un dommage. Il se remonte immédiatement, à votre encadrement et au client puisque l'évènement a lieu sur son site. Attendre le bilan de fin de chantier retarde le traitement de la cause, et l'absence de plainte du client ne change rien à la nature de l'évènement.",
    ref: "Cas terrain AP2I – remontée d'un presqu'accident (MASE v2024)"
  }
];

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const state = {
  screen: 'participant',
  participant: { prenom: '', nom: '', poste: '' },
  current: 0,
  answers: [],
  startTime: null,
  trackingStatus: 'pending',
};

const app = document.getElementById('app');

function render() {
  if (state.screen === 'participant') renderParticipant();
  else if (state.screen === 'quiz')   renderQuiz();
  else                                renderResults();
}

// ── PARTICIPANT ───────────────────────────────────────────────────────────
function renderParticipant() {
  app.innerHTML = `
    <div class="participant-card">
      <h2>Vos informations</h2>
      <p>Renseignez vos coordonnées avant de commencer. Vos résultats seront transmis automatiquement.</p>

      <div class="topic-banner">
        <span class="topic-icon">🚨</span>
        <div>
          <h3>Formation : Accident, presqu'accident et droit d'alerte et de retrait</h3>
          <p>10 questions · Vocabulaire SSE · Déclaration et délais · Recueil des faits · Droit d'alerte et de retrait</p>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input type="text" id="prenom" placeholder="Votre prénom" value="${state.participant.prenom}">
        </div>
        <div class="form-group">
          <label for="nom">Nom *</label>
          <input type="text" id="nom" placeholder="Votre nom" value="${state.participant.nom}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="poste">Poste / Fonction</label>
          <input type="text" id="poste" placeholder="Ex : Électricien industriel, Automaticien…" value="${state.participant.poste !== '-' ? state.participant.poste : ''}">
        </div>
      </div>
      <button class="btn-start" onclick="startQuiz()">Commencer le quiz →</button>
    </div>
  `;
}

function startQuiz() {
  const p = document.getElementById('prenom').value.trim();
  const n = document.getElementById('nom').value.trim();
  const po = document.getElementById('poste').value.trim();
  if (!p || !n) { alert('Veuillez renseigner votre prénom et votre nom.'); return; }
  state.participant = { prenom: p, nom: n, poste: po || '-' };
  state.current = 0; state.answers = [];
  state.startTime = Date.now(); state.screen = 'quiz';
  render();
}

// ── QUIZ ──────────────────────────────────────────────────────────────────
function renderQuiz() {
  const idx = state.current;
  const total = QUESTIONS.length;
  const q = QUESTIONS[idx];
  const answered = state.answers[idx] !== undefined;
  const chosen = state.answers[idx];
  const pct = Math.round((idx / total) * 100);
  const letters = ['A', 'B', 'C', 'D'];

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-label">Question ${idx + 1} / ${total}</span>
        <span class="progress-count">${pct}% complété</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="question-card">
      <div class="question-meta">Accident, presqu'accident et droit d'alerte et de retrait</div>
      <div class="question-text">${q.q}</div>

      <div class="options" id="optList">
        ${q.choices.map((c, i) => {
          let cls = 'option';
          if (answered) {
            cls += ' disabled';
            if (i === q.answer)  cls += ' correct';
            else if (i === chosen && i !== q.answer) cls += ' wrong';
          }
          return `<div class="${cls}" onclick="selectAnswer(${i})">
            <span class="opt-letter">${letters[i]}</span>
            <span>${c}</span>
          </div>`;
        }).join('')}
      </div>

      ${answered ? `
        <div class="feedback ${chosen === q.answer ? 'correct-fb' : 'wrong-fb'}">
          <div class="fb-title">${chosen === q.answer ? '✅ Bonne réponse !' : '❌ Réponse incorrecte'}</div>
          ${q.expl}
          <div class="fb-ref">${q.ref}</div>
        </div>
        <button class="btn-next" onclick="nextQuestion()">
          ${idx + 1 < total ? 'Question suivante →' : 'Voir mes résultats →'}
        </button>
      ` : ''}
    </div>
  `;
}

function selectAnswer(i) {
  if (state.answers[state.current] !== undefined) return;
  state.answers[state.current] = i;
  render();
}

function nextQuestion() {
  if (state.current + 1 < QUESTIONS.length) {
    state.current++;
    render();
  } else {
    state.screen = 'results';
    sendToSheets();
    render();
  }
}

// ── RESULTS ───────────────────────────────────────────────────────────────
function renderResults() {
  const total = QUESTIONS.length;
  const score = state.answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const pct   = Math.round((score / total) * 100);
  const dur   = Math.round((Date.now() - state.startTime) / 60000);

  const ringCls = pct >= 70 ? 'score-success' : pct >= 50 ? 'score-partial' : 'score-fail';
  const msg = pct >= 70
    ? 'Formation validée – Bon travail !'
    : pct >= 50
    ? 'Des lacunes persistent – Revoir le support de formation'
    : 'Score insuffisant – Une révision complète est nécessaire';

  const reviewItems = QUESTIONS.map((q, i) => {
    const a = state.answers[i];
    const ok = a === q.answer;
    const letters = ['A', 'B', 'C', 'D'];
    return `
      <div class="review-item" id="rv${i}">
        <div class="review-header" onclick="toggleReview(${i})">
          <span class="review-icon">${ok ? '✅' : '❌'}</span>
          <span class="review-q">Q${i+1} – ${q.q.substring(0, 70)}…</span>
          <span class="review-chevron">▶</span>
        </div>
        <div class="review-body">
          ${!ok ? `<div class="rv-your">Votre réponse : ${letters[a]} – ${q.choices[a]}</div>` : ''}
          <div class="rv-correct">✔ Bonne réponse : ${letters[q.answer]} – ${q.choices[q.answer]}</div>
          <div class="rv-expl">${q.expl}</div>
          <div class="rv-expl" style="margin-top:4px;">${q.ref}</div>
        </div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="results-card">
      <h2>Résultats de ${state.participant.prenom} ${state.participant.nom}</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:4px;">
        Poste : ${state.participant.poste} &nbsp;·&nbsp; Durée : ${dur} min &nbsp;·&nbsp; Août 2026
      </p>

      <div class="score-ring-wrap">
        <div class="score-circle ${ringCls}">
          <span class="sc-pct">${pct}%</span>
          <span class="sc-raw">${score} / ${total}</span>
        </div>
        <div class="score-message">${msg}</div>
        <div class="score-sub">Seuil de validation : 70%</div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="sb-val" style="color:var(--success)">${score}</div>
          <div class="sb-lbl">Bonnes réponses</div>
        </div>
        <div class="stat-box">
          <div class="sb-val" style="color:var(--danger)">${total - score}</div>
          <div class="sb-lbl">Mauvaises réponses</div>
        </div>
        <div class="stat-box">
          <div class="sb-val">${dur}</div>
          <div class="sb-lbl">Minutes</div>
        </div>
      </div>

      <div class="tracking-box ${state.trackingStatus === 'sent' ? 'sent' : state.trackingStatus === 'error' ? 'error' : 'pending'}" id="trackBox">
        ${state.trackingStatus === 'sent'
          ? '✅ Résultats enregistrés dans Google Sheets'
          : state.trackingStatus === 'error'
          ? "⚠️ Erreur d'envoi – vérifiez la configuration dans le fichier HTML"
          : '⏳ Envoi en cours…'}
      </div>

      <h3 style="margin-top:24px;color:var(--navy);font-size:16px;">Revue question par question</h3>
      <div class="review-list">${reviewItems}</div>

      <button class="btn-next" style="margin-top:24px" onclick="location.reload()">Recommencer le quiz</button>
    </div>
  `;
}

function toggleReview(i) {
  const el = document.getElementById('rv' + i);
  el.classList.toggle('open');
  el.querySelector('.review-chevron').textContent = el.classList.contains('open') ? '▼' : '▶';
}

// ── TRACKING ──────────────────────────────────────────────────────────────
async function sendToSheets() {
  if (!SHEETS_URL) { state.trackingStatus = 'error'; return; }
  const now   = new Date();
  const total = QUESTIONS.length;
  const score = state.answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const dur   = Math.round((Date.now() - state.startTime) / 60000);
  const details = QUESTIONS.map((q, i) => `Q${i+1}:${state.answers[i] === q.answer ? 'OK' : 'KO'}`).join(' | ');

  const payload = {
    date:        now.toLocaleDateString('fr-FR'),
    heure:       now.toLocaleTimeString('fr-FR'),
    prenom:      state.participant.prenom,
    nom:         state.participant.nom,
    poste:       state.participant.poste || '-',
    score:       score,
    total:       total,
    pourcentage: Math.round((score / total) * 100) + '%',
    duree:       dur,
    details:     details,
    formation:   "Août 2026 – Accident, presqu'accident et droit d'alerte et de retrait"
  };

  try {
    await fetch(SHEETS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    state.trackingStatus = 'sent';
  } catch(err) {
    state.trackingStatus = 'error';
  }

  const tb = document.getElementById('trackBox');
  if (tb) {
    tb.className = 'tracking-box ' + (state.trackingStatus === 'sent' ? 'sent' : 'error');
    tb.textContent = state.trackingStatus === 'sent'
      ? '✅ Résultats enregistrés dans Google Sheets'
      : "⚠️ Erreur d'envoi – vérifiez la configuration dans le fichier HTML";
  }
}

render();
</script>
</body>
</html>
