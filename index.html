<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Formations et quiz sécurité MASE – AP2I</title>
<style>
:root{
  --bg:#f4f7fa; --card:#ffffff; --text:#0B1F3A; --muted:#3E5470; --line:#dbe3ea;
  --navy:#0064A0; --link:#0064A0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Calibri,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.45}
header{background:#fff;border-bottom:3px solid var(--navy);padding:20px 16px 18px}
.entete{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.logo{display:block;width:150px;height:auto}
header h1{margin:0 0 4px;font-size:1.5rem;color:var(--text)}
header p{margin:0;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:20px 16px 8px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.mois{margin:0;font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.titre{margin:2px 0 12px;font-size:1.1rem;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;font-weight:700;text-decoration:none;font-size:1rem}
.btn-quiz{background:var(--navy);color:#fff}
.btn-form{border:2px solid var(--link);color:var(--link)}
.btn-off{border:2px dashed var(--line);color:var(--muted);font-weight:400}
footer{max-width:720px;margin:0 auto;padding:8px 16px 28px;color:var(--muted);font-size:.85rem}
</style>
</head>

      <h1>Formations et quiz sécurité MASE</h1>
      <p>AP2I – Filiale TREMA Multitechnique · Reims</p>
    </div>

</header>
<main id="liste"></main>
<footer>Un quiz par mois, à faire directement sur téléphone. Les modules les plus récents sont en haut de la liste.</footer>

<script>
/*
  POUR AJOUTER UN MOIS : copier un bloc { ... }, le coller EN HAUT de la liste, puis adapter.
  - quiz      : nom du fichier du quiz dans le dépôt (ex. "octobre.html")
  - formation : chemin du PDF dans le dépôt (ex. "formations/octobre.pdf"), ou null s'il n'est pas encore publié
*/
const MODULES = [
  { mois:"Octobre 2026", titre:"REX et remontée d'informations", quiz:"octobre.html", formation:"formations/octobre.pdf" },
  { mois:"Septembre 2026", titre:"EPI : choix, port obligatoire et entretien", quiz:"septembre.html", formation:"formations/septembre.pdf" },
  { mois:"Août 2026", titre:"Accident, presqu’accident et droit d’alerte et de retrait", quiz:"aout.html", formation:"formations/aout.pdf" },
  { mois:"Juillet 2026", titre:"Chute de plain-pied : prévention et ordre sur chantier", quiz:"juillet.html", formation:"formations/juillet.pdf" },
  { mois:"Juin 2026", titre:"Sécurité électrique et habilitation", quiz:"juin.html", formation:"formations/juin.pdf" },
  { mois:"Mai 2026", titre:"Risques routiers et sécurité des déplacements", quiz:"mai.html", formation:"formations/mai.pdf" },
  { mois:"Avril 2026", titre:"Risques liés aux machines et aux outils", quiz:"avril.html", formation:"formations/avril.pdf" },
];

const conteneur = document.getElementById("liste");

function el(tag, classe, texte){
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texte) e.textContent = texte;
  return e;
}
function lien(classe, texte, href){
  const a = el("a", classe, texte);
  a.href = href;
  return a;
}

MODULES.forEach(m => {
  const carte = el("section", "card");
  carte.appendChild(el("p", "mois", m.mois));
  carte.appendChild(el("p", "titre", m.titre));
  const actions = el("div", "actions");
  actions.appendChild(lien("btn btn-quiz", "Faire le quiz", m.quiz));
  actions.appendChild(m.formation
    ? lien("btn btn-form", "Voir la formation (PDF)", m.formation)
    : el("span", "btn btn-off", "Formation : bientôt disponible"));
  carte.appendChild(actions);
  conteneur.appendChild(carte);
});
</script>
</body>
